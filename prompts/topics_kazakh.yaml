# Kazakh-language topics aligned to the official NTC teacher-certification
# test specification (files/test_specific/Қазақ-тілі.docx). The standalone
# 40 items are linguistics-based (phonetics → syntax → style); the final
# topic also covers the context/literary-text analysis used by the 10
# context-based items (2 passages × 5 questions).
topics:
  - id: phonetics_orthography
    name_en: "Phonetics and Orthography"
    name_kz: "Фонетика және орфография"
    keywords: ["vowels", "consonants", "vowel harmony", "assimilation", "spelling", "orthographic norm"]
    subtopics:
      - "Дауысты және дауыссыз дыбыстардың емлесі"
      - "Үндестік заңы (дыбыс үндестігі)"
      - "Ілгерінді, кейінді және тоғыспалы ықпал"
      - "Орфографиялық нормаға сай жазылуы"

  - id: lexicology_meaning
    name_en: "Lexicology — Word Meaning"
    name_kz: "Лексика (сөз мағынасы)"
    keywords: ["meaning", "homonym", "synonym", "antonym", "polysemy", "direct and figurative meaning", "word formation"]
    subtopics:
      - "Сөз және оның мағынасы"
      - "Омоним, синоним, антоним"
      - "Тура және ауыспалы мағыналы сөздер"
      - "Көп мағыналы сөздер"
      - "Сөздердің жасалу жолдары"

  - id: morphology_nominals
    name_en: "Morphology — Nominals"
    name_kz: "Морфология (есім сөздер)"
    keywords: ["noun", "numeral", "adjective", "degrees of comparison", "pronoun", "derived words", "nominalization"]
    subtopics:
      - "Туынды және күрделі сөздер"
      - "Зат есім: мағыналық түрлері, түрленуі"
      - "Сан есім: мағыналық түрлері, заттануы"
      - "Сын есім: мағыналық түрлері, шырайлары, заттануы"
      - "Есімдік және оның мағыналық түрлері"

  - id: syntax_reported_speech
    name_en: "Syntax — Reported Speech"
    name_kz: "Синтаксис (төл сөз бен төлеу сөз)"
    keywords: ["direct speech", "reported speech", "author's words", "conversion"]
    subtopics:
      - "Төл сөз және автор сөзі"
      - "Төлеу сөз"
      - "Төл сөзді төлеу сөзге айналдыру жолдары"

  - id: lexicology_special
    name_en: "Lexicology — Special Vocabulary and Phraseology"
    name_kz: "Лексика (арнаулы лексика, фразеология)"
    keywords: ["neologism", "term", "dialect", "professional words", "archaism", "euphemism", "dysphemism", "taboo", "phraseology", "proverbs"]
    subtopics:
      - "Неологизм, термин, диалект, кәсіби сөздер"
      - "Көнерген сөздер"
      - "Эвфемизм, дисфемизм, табу"
      - "Фразеологизм, мақал-мәтелдер"

  - id: morphology_verbs_particles
    name_en: "Morphology — Verbs and Function Words"
    name_kz: "Морфология (етістік, көмекші сөздер)"
    keywords: ["adverb", "particle", "verb tense", "verb mood", "imitative words", "interjection", "isolated words"]
    subtopics:
      - "Үстеу және оның мағыналық түрлері"
      - "Шылаудың емлесі, орфографиялық норма"
      - "Етістіктің шақ түрлері мен рай түрлері"
      - "Еліктеуіш және бейнелеуіш сөздер"
      - "Одағай түрлері; оқшау сөздер"

  - id: syntax_simple_sentence
    name_en: "Syntax — Phrases and Simple Sentence"
    name_kz: "Синтаксис (сөз тіркесі, жай сөйлем)"
    keywords: ["word combination", "sentence members", "homogeneous members", "sentence types", "simple sentence"]
    subtopics:
      - "Сөз тіркесінің байланысу тәсілдері мен түрлері"
      - "Есімді және етістікті сөз тіркестері"
      - "Сөйлем мүшелері (тұрлаулы, тұрлаусыз)"
      - "Бірыңғай мүшелер, айқындауыш мүшелер"
      - "Сөйлемнің айтылу мақсатына қарай түрлері; жай сөйлем түрлері"

  - id: syntax_coordinate_clauses
    name_en: "Syntax — Coordinate Compound Sentences"
    name_kz: "Синтаксис (салалас құрмалас сөйлем)"
    keywords: ["coordinate compound sentence", "connective", "causal", "adversative", "explanatory", "alternative", "sequential"]
    subtopics:
      - "Ыңғайлас салалас"
      - "Себеп-салдар салалас"
      - "Қарсылықты салалас"
      - "Түсіндірмелі салалас"
      - "Талғаулы және кезектес салалас"

  - id: syntax_subordinate_clauses
    name_en: "Syntax — Subordinate Compound Sentences"
    name_kz: "Синтаксис (сабақтас құрмалас сөйлем)"
    keywords: ["subordinate compound sentence", "conditional", "concessive", "temporal", "causal", "manner", "purpose"]
    subtopics:
      - "Шартты бағыныңқы сабақтас"
      - "Қарсылықты бағыныңқы сабақтас"
      - "Мезгіл бағыныңқы сабақтас"
      - "Себеп бағыныңқы сабақтас"
      - "Қимыл-сын және мақсат бағыныңқы сабақтас"

  - id: style_and_text_analysis
    name_en: "Language Norm, Style and Text Analysis"
    name_kz: "Тілдік жүйе, стиль және мәтін талдау"
    keywords: ["style", "scientific style", "language norm", "word usage", "text analysis", "literary work", "theme", "idea", "artistic devices"]
    subtopics:
      - "Сөз қолданысындағы ерекшеліктер және стиль"
      - "Ғылыми және ғылыми-көпшілік стиль ерекшеліктері"
      - "Сөзжасамдық және синтаксистік нормаларды сақтау"
      - "Әртүрлі стильдегі мәтіндерді салыстыра талдау"
      - "Мәнмәтіндік тапсырмалар: әдеби шығарманың жанры, фабуласы, сюжеті"
      - "Әдеби шығарманың тақырыбы мен идеясы, образы, кейіпкерлер портреті"
      - "Шығармадағы көркемдегіш құралдар мен тілдік көріністі талдау"
